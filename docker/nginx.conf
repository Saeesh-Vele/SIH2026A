# ═══════════════════════════════════════════════════════════════
#  Aurora — nginx: serves the Vite bundle and reverse-proxies the backend so the
#  browser only ever talks to one origin (no CORS, no backend address in the JS).
#
#  Installed as /etc/nginx/templates/default.conf.template, so the nginx entrypoint
#  substitutes ${BACKEND_HOST} and ${BACKEND_PORT} at container start.
# ═══════════════════════════════════════════════════════════════

# ── Backend resolution ───────────────────────────────────────
# NOT an `upstream` block with a static server name: nginx resolves such a name ONCE at
# config load, so recreating the backend container (new IP) leaves nginx proxying to a
# dead address until nginx itself restarts. That is a realistic flow — editing .env and
# running `docker compose up -d` recreates the backend but leaves this container alone —
# and the whole site would 502.
#
# Using a variable in proxy_pass makes nginx resolve per request instead, via this
# resolver. NGINX_LOCAL_RESOLVERS is filled in from the container's /etc/resolv.conf by
# the image's entrypoint (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1), so Docker's embedded DNS
# is picked up without being hardcoded.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
resolver_timeout 5s;

# ── Rate limiting ────────────────────────────────────────────
# Zones keyed on the client address. 10m holds ~160k addresses, far more than a demo
# needs. These protect the backend from a hammering; ADMIN_TOKEN protects writes, and the
# simulator's own GROQ_MAX_CALLS_PER_HOUR caps the spend regardless of these limits.
#
#   api     general traffic. The limit is per CLIENT ADDRESS, and at a demo several
#           viewers usually share one public IP behind NAT — so this has to hold a few
#           people's dashboards at once, not one. Each dashboard polls several endpoints
#           every 2–4 s and a page load fans out to roughly a dozen requests, so 30 r/s
#           with a burst of 60 covers a handful of simultaneous viewers while still
#           stopping a flood (which is thousands per second, not tens).
#   explain the AI explain routes, which cost an upstream LLM call: 5 per minute. Kept
#           strict because it costs money; note that NAT'd viewers share this budget.
#   demo    public demo scenario start/reset (judge mode): 6 per minute per address. The
#           backend adds the real rules (one scenario per station, 60 s per visitor).
#   sandbox visitor-sandbox writes (judge mode): 60 per minute per address; the backend
#           also caps each sandbox session at SANDBOX_WRITES_PER_MIN.
#   assistant  Aurora's chat route: 12 per minute per address (burst 4). Most requests
#           are answered from station data without an LLM call (lookups, and commands the
#           browser parses itself never get here); the Groq caps bound the spend anyway.
limit_req_zone $binary_remote_addr zone=aurora_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=aurora_explain:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aurora_demo:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=aurora_sandbox:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=aurora_assistant:10m rate=12r/m;

# The client's real address. Behind Caddy (docker-compose.https.yml) every request arrives
# from the Caddy container, so without this all visitors would share one rate-limit bucket
# and one demo cooldown. X-Real-IP is trusted ONLY from private (Docker/loopback) networks:
# a request straight from the internet keeps its own address and cannot spoof the header.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;

# 429 rather than nginx's default 503, so the UI can tell "slow down" from "broken".
limit_req_status 429;
limit_conn_status 429;

# Cap concurrent connections per address as well: the WebSocket is long-lived, and a
# handful of browser tabs is normal, so this only stops a connection flood.
limit_conn_zone $binary_remote_addr zone=aurora_conn:10m;

# Map the client's Upgrade header through to the backend. Without this a plain
# `proxy_set_header Connection upgrade` would break ordinary keep-alive requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser sees the station config, telemetry snapshots and reports; none of it
    # is large, but gzip still saves a lot on the JSON and the bundle.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # No endpoint takes a large body: the biggest is a telemetry batch (bounded to
    # 20x20 sensors by the Pydantic model) and an explain request (free text capped at
    # 500 chars). 64 kB is generous, and anything larger gets 413 before it reaches
    # the backend.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    server_tokens off;

    # 64 concurrent connections per address: plenty for several tabs plus WebSockets.
    limit_conn aurora_conn 64;

    # A readable 429 instead of nginx's HTML error page. The UI shows `detail`.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 10 always;
        return 429 '{"detail":"Too many requests — please slow down and try again in a few seconds."}';
    }

    # 413 for an oversized body, in the same JSON shape the frontend already parses.
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 413 '{"detail":"Request body too large (limit 64 kB)."}';
    }

    # ── Security headers ──────────────────────────────────────
    # add_header is not additive across levels: a location that sets any header of its
    # own loses every header inherited from here. The snippet is therefore included in
    # each location below as well — removing it from one silently drops the CSP there.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Container healthcheck ─────────────────────────────────
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── WebSocket: /ws/station -> backend ─────────────────────
    # Must come before the SPA fallback. The telemetry stream is long-lived and the
    # backend only pushes on each tick, so the read timeout has to be generous.
    location /ws {
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── AI explain: the expensive route, limited hard ─────────
    # Every call can mean an upstream LLM request, so this is 5/min per address with a
    # burst of 2. `nodelay` matters here: without it nginx *delays* excess requests to
    # conform to the rate, so a caller would silently wait 12-24 s with the connection
    # held open and the UI apparently hung — and sequential callers would never be
    # refused at all. Rejecting immediately with the friendly 429 the frontend already
    # displays is both honest and cheaper.
    # The three paths are aliases of one backend route.
    location ~ ^/api/(aurora-explain|explain|ai/explain)$ {
        limit_req zone=aurora_explain burst=2 nodelay;
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An LLM round trip is slower than an ordinary API call.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── Aurora assistant chat: may call the LLM, limited like explain but roomier ──
    # A conversation is several short turns, so 12/min with a burst of 4; `nodelay` for the
    # same reason as above (refuse at once with the 429 the panel explains).
    location = /api/assistant/chat {
        limit_req zone=aurora_assistant burst=4 nodelay;
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── Telemetry ingest: internal only ───────────────────────
    # The simulator POSTs /api/sensors/batch straight to backend:8080 on the Docker
    # network; no browser or public client ever needs it. ADMIN_TOKEN already guards it,
    # but answering 404 here keeps the ingest route off the public surface entirely, so a
    # leaked token still cannot inject telemetry from outside. nginx matches locations
    # after decoding %XX and merging slashes, so encoded or doubled-slash variants land
    # here too; the optional trailing slash covers FastAPI's redirect.
    location ~ ^/api/sensors/batch/?$ {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404 '{"detail":"Not Found"}';
    }

    # ── Judge mode: public demo scenarios ─────────────────────
    # Anyone may start or reset a predefined scenario (they change the shared simulator),
    # so the address gets a tight budget here on top of the backend's own rules.
    location ~ ^/api/sim/(inject/[a-z0-9_]+|reset)$ {
        limit_req zone=aurora_demo burst=3 nodelay;
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── Judge mode: visitor-sandbox writes ────────────────────
    location ~ ^/api/(sandbox/reset|logistics/update|remote/dispatch|admin/config(/reset)?|alerts/[^/]+/acknowledge)$ {
        limit_req zone=aurora_sandbox burst=20 nodelay;
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── REST: /api/* -> backend ───────────────────────────────
    location /api/ {
        # burst=60 with nodelay absorbs several page loads' fan-out at once without
        # queueing any of them.
        limit_req zone=aurora_api burst=60 nodelay;
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI/explain routes are proxied on to the simulator, and a Chronos
        # forecast can take a few seconds on a small VM.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        # API responses are per-request state; never let a proxy or browser keep them.
        add_header Cache-Control "no-store" always;
    }

    # ── Static assets ─────────────────────────────────────────
    # Vite fingerprints every file under /assets/, so these can be cached forever.
    location /assets/ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed files in public/ (the favicon, logos): a day is a safe middle ground.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────
    # index.html must never be cached, or a browser keeps loading asset hashes that
    # no longer exist after an update.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
