name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'simulator/requirements*.txt'
      - 'package-lock.json'
  workflow_dispatch:

# No secrets beyond the built-in GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io requires a lowercase namespace; github.repository_owner is "Saeesh-Vele".
  IMAGE_PREFIX: ghcr.io/saeesh-vele/sih2026a
  # amd64 on every push (fast, native); arm64 is emulated and roughly triples the build,
  # so it is added only for version tags and manual runs.
  PLATFORMS_DEFAULT: linux/amd64
  PLATFORMS_RELEASE: linux/amd64,linux/arm64

jobs:
  # ── Does the stack actually come up? ────────────────────────
  # Runs first and on amd64 only, so a broken compose file fails in ~3 minutes
  # instead of after the (much slower) arm64 builds.
  compose-smoke:
    name: compose up (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-buildx-action here on purpose: it switches the default builder to the
      # docker-container driver, and this job needs the built images in the local image
      # store (docker image inspect, docker compose up --no-build). Compose uses BuildKit
      # regardless. The `build` job below does use buildx, because it needs multi-arch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build and start are separate steps so a failure says which one broke, and
      # --progress plain keeps the full build output in the log.
      # Every compose file, not just the base one: the overlays use !reset / !override,
      # which a typo turns into silently dropped settings rather than an error.
      - name: Validate every compose configuration
        env:
          DOMAIN: aurora.example.invalid
          ACME_EMAIL: ci@example.invalid
        run: |
          docker compose version
          docker compose config --quiet
          echo "base: ok"
          docker compose -f docker-compose.yml -f docker-compose.offline.yml config --quiet
          echo "offline: ok"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          echo "prod: ok"
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
          echo "https: ok"

          # !override must keep the internal network; !reset would have emptied it.
          docker compose -f docker-compose.yml -f docker-compose.offline.yml config \
            | python3 -c "
          import sys, yaml
          c = yaml.safe_load(sys.stdin)
          for svc in ('backend', 'simulator'):
              nets = list(c['services'][svc].get('networks') or {})
              assert nets == ['aurora-internal'], f'{svc} offline networks: {nets}'
          assert sorted(c['services']['frontend']['networks']) == ['aurora', 'aurora-internal']
          print('offline overlay: the Python services are internal-only')
          "
          # prod must pull images, not build; https must not publish the frontend.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
            | python3 -c "
          import sys, yaml
          c = yaml.safe_load(sys.stdin)
          for svc in ('frontend', 'backend', 'simulator'):
              s = c['services'][svc]
              assert 'build' not in s, f'{svc} still builds in the prod overlay'
              assert s['image'].startswith('ghcr.io/saeesh-vele/sih2026a-'), s['image']
          print('prod overlay: all three services pull from GHCR')
          "
          DOMAIN=aurora.example.invalid ACME_EMAIL=ci@example.invalid \
            docker compose -f docker-compose.yml -f docker-compose.https.yml config \
            | python3 -c "
          import sys, yaml
          c = yaml.safe_load(sys.stdin)
          assert not c['services']['frontend'].get('ports'), 'frontend still publishes a port under HTTPS'
          ports = [p['published'] for p in c['services']['caddy']['ports']]
          assert '80' in ports and '443' in ports, ports
          print('https overlay: only Caddy publishes 80/443')
          "

      # One step per image: the step name alone identifies which build broke.
      - name: Build the backend image
        run: docker compose build --progress plain backend

      - name: Build the simulator image
        run: docker compose build --progress plain simulator

      - name: Build the frontend image
        run: docker compose build --progress plain frontend

      # Reporting only — it must never block the verification that follows.
      - name: Image sizes
        continue-on-error: true
        run: |
          docker images || true
          {
            echo '### Image sizes (amd64, WITH_ML=false)'
            echo
            echo '| Image | Size |'
            echo '|---|---|'
            for img in aurora-frontend:local aurora-backend:local aurora-simulator:local; do
              size=$(docker image inspect "$img" --format '{{.Size}}' 2>/dev/null || echo '')
              if [ -n "$size" ]; then
                printf '| %s | %s |\n' "$img" "$(numfmt --to=iec --suffix=B "$size" 2>/dev/null || echo "$size bytes")"
              else
                printf '| %s | not in the local image store |\n' "$img"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the stack
        run: |
          docker compose up -d --no-build
          docker compose ps

      - name: Wait for all three containers to be healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "healthy" { print $1 }')
            if [ -z "$unhealthy" ]; then echo "all healthy"; exit 0; fi
            echo "waiting on: $unhealthy"
            sleep 5
          done
          echo "::error::containers never became healthy"
          docker compose ps
          docker compose logs --tail=80
          exit 1

      - name: The UI and the proxied API answer on :80
        run: |
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS http://localhost/healthz | grep -q ok
          curl -fsS http://localhost/api/health | tee /tmp/health.json
          python3 -c "
          import json; h = json.load(open('/tmp/health.json'))
          assert h['db']['ok'], h
          assert h['simulator']['reachable'], h
          print('health ok:', h['status'], 'stations:', list(h['stations']))
          "

      # nginx's add_header is not inherited into a location that sets any header of its
      # own, so every location class is checked — the HTML, a hashed asset and the
      # proxied API. One missing include silently drops the CSP for that path.
      # Split into one step per concern: the step name alone says what broke.
      - name: Capture the response headers
        run: |
          # `|| true` because GitHub runs steps with `-o pipefail` and `head` closes the
          # pipe early.
          asset=$(curl -fsS http://localhost/ | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
          test -n "$asset" || { echo "::error::could not find the hashed entry asset"; exit 1; }
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          mkdir -p /tmp/hdr
          # GET with -D, not -I: FastAPI's @app.get does not register HEAD, so a HEAD on
          # /api/health is a 405 and `curl -f` would fail. GET is also what a browser does,
          # so these are the headers that actually reach the app.
          curl -fsS -o /dev/null -D /tmp/hdr/root.txt  "http://localhost/"
          curl -fsS -o /dev/null -D /tmp/hdr/asset.txt "http://localhost${asset}"
          curl -fsS -o /dev/null -D /tmp/hdr/api.txt   "http://localhost/api/health"
          {
            echo '### Response headers'
            for f in root asset api; do
              echo; echo "#### $f"; echo '```'; cat "/tmp/hdr/$f.txt"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          head -40 /tmp/hdr/root.txt /tmp/hdr/asset.txt /tmp/hdr/api.txt

      - name: Header — Content-Security-Policy on HTML, asset and API
        run: |
          for f in root asset api; do
            grep -iq 'content-security-policy' "/tmp/hdr/$f.txt" \
              || { echo "::error::$f is missing the CSP"; exit 1; }
          done

      - name: Header — nosniff, referrer-policy, frame-options, permissions-policy
        run: |
          fail=0
          for f in root asset api; do
            for h in 'x-content-type-options: nosniff' 'referrer-policy' \
                     'x-frame-options' 'permissions-policy'; do
              grep -iq "$h" "/tmp/hdr/$f.txt" || { echo "::error::$f missing: $h"; fail=1; }
            done
          done
          exit $fail

      - name: Caching — index.html is never cached
        run: |
          grep -iq 'cache-control: no-store' /tmp/hdr/root.txt

      - name: Caching — hashed assets are immutable
        run: |
          grep -iq 'immutable' /tmp/hdr/asset.txt

      - name: Caching — API responses are never cached
        run: |
          grep -iq 'cache-control: no-store' /tmp/hdr/api.txt

      - name: Caching — exactly one Cache-Control per response
        run: |
          fail=0
          for f in root asset; do
            n=$(grep -ic '^cache-control:' "/tmp/hdr/$f.txt" || true)
            test "$n" -eq 1 || { echo "::error::$f returned $n Cache-Control headers"; fail=1; }
          done
          exit $fail

      - name: SPA fallback serves index.html for a deep link
        run: |
          curl -fsS http://localhost/some/deep/route | grep -q '<div id="root">'

      # Load balancers and uptime checks send HEAD; both health endpoints must answer
      # 200 with no body, not 405.
      - name: HEAD works on /healthz and the proxied /api/health
        run: |
          # -I writes the response HEADERS to stdout, so -o would never be empty.
          # %{size_download} is the body size, which must be 0 for a HEAD response.
          for path in /healthz /api/health; do
            read -r code size <<<"$(curl -s -o /dev/null \
              -w '%{http_code} %{size_download}' -I "http://localhost${path}")"
            test "$code" = "200" || { echo "::error::HEAD ${path} returned ${code}"; exit 1; }
            test "$size" = "0" || { echo "::error::HEAD ${path} returned a ${size}-byte body"; exit 1; }
            echo "HEAD ${path}: 200, no body"
          done
          # GET must still return the full report, not an empty 200.
          curl -fsS http://localhost/api/health | grep -q '"stations"'

      # ── Abuse protection ──────────────────────────────────────
      - name: Install the browser test toolchain
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser smoke test through nginx
        env:
          E2E_BASE_URL: http://localhost
        run: npm run test:e2e

      # After the browser tests (same client address), so the burst below cannot starve them.
      - name: Aurora — the chat route answers through nginx and is rate-limited
        run: |
          body='{"stationId":"maitri","text":"what is the fuel situation"}'
          sleep 10   # let the per-address bucket refill after the browser tests
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$body" \
            http://localhost/api/assistant/chat | tee /tmp/aurora.json | grep -q '"topic":"fuel"'
          head -c 300 /tmp/aurora.json; echo
          codes=""
          for i in $(seq 1 10); do
            codes="$codes $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d "$body" http://localhost/api/assistant/chat)"
          done
          echo "status codes:$codes"
          echo "$codes" | grep -q 429 || { echo "::error::no 429 from /api/assistant/chat after a burst"; exit 1; }

      # ── Write protection ──────────────────────────────────────
      # The token comes from the step environment, never inline in a curl -H: a literal
      # there is indistinguishable from a real leaked credential (gitleaks'
      # curl-auth-header rule flags it, correctly).
      # One assertion per step, so a failure names itself without reading the log.
      - name: Enable write protection and recreate the Python services
        env:
          ADMIN_TOKEN: ci-operator-token
        run: |
          # Deliberately recreates ONLY the Python services, exactly as `docker compose
          # up -d` does after an .env edit: the backend gets a new IP while the frontend
          # keeps running, which also exercises nginx's per-request DNS resolution.
          echo "ADMIN_TOKEN=${ADMIN_TOKEN}" >> .env
          docker compose up -d --force-recreate backend simulator
          docker compose ps

      # Both services were just recreated, so wait for the backend to answer through
      # nginx AND for it to see the simulator again. /api/sim/* is a proxy route: without
      # the second wait it answers 503 (simulator still starting), not the 200 the
      # authenticated case asserts.
      - name: Write — nginx reaches the backend and the backend sees the simulator
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -m 3 http://localhost/api/health > /tmp/wp-health.json 2>/dev/null \
               && python3 -c "
          import json,sys
          h = json.load(open('/tmp/wp-health.json'))
          sys.exit(0 if h['db']['ok'] and h['simulator']['reachable'] else 1)
          " 2>/dev/null; then
              echo "backend and simulator both back after $((i * 3))s"
              head -c 300 /tmp/wp-health.json; echo
              exit 0
            fi
            sleep 3
          done
          echo "::error::the recreated stack never came back through nginx"
          curl -sS -o /dev/null -w 'status %{http_code}\n' http://localhost/api/health || true
          cat /tmp/wp-health.json 2>/dev/null || true
          docker compose ps
          docker compose logs --tail=60 frontend backend simulator
          exit 1

      - name: Write — the backend picked the token up
        run: |
          curl -fsS http://localhost/api/admin/session | tee /tmp/wp-session.json
          python3 -c "
          import json
          s = json.load(open('/tmp/wp-session.json'))
          assert s['writeProtected'] is True, f'backend did not pick up ADMIN_TOKEN: {s}'
          assert s['authenticated'] is False, s
          print('write protection active')
          "

      - name: Write — no token is 401
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "http://localhost/api/sim/reset?stationId=maitri")
          test "$code" = "401" || { echo "::error::expected 401, got $code"; exit 1; }

      - name: Write — a wrong token is 401
        env:
          ADMIN_TOKEN: ci-operator-token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Admin-Token: not-${ADMIN_TOKEN}" \
            "http://localhost/api/sim/reset?stationId=maitri")
          test "$code" = "401" || { echo "::error::expected 401, got $code"; exit 1; }

      - name: Write — the right token is accepted
        env:
          ADMIN_TOKEN: ci-operator-token
        run: |
          code=$(curl -s -o /tmp/wp-write.json -w '%{http_code}' -X POST \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            "http://localhost/api/sim/reset?stationId=maitri")
          cat /tmp/wp-write.json; echo
          test "$code" = "200" || {
            echo "::error::expected 200, got $code (503 here means the proxied simulator, not auth)"
            docker compose logs --tail=40 simulator
            exit 1
          }

      - name: Write — reads stay public with protection on
        run: |
          for path in /api/health /api/stations /api/station/maitri/state \
                      /api/alerts?stationId=maitri /api/admin/config?stationId=maitri; do
            curl -fsS -o /dev/null "http://localhost${path}" \
              || { echo "::error::a read was refused: $path"; exit 1; }
          done
          echo "reads need no token"

      - name: Write — the simulator still ingests with the token set
        run: |
          # The simulator authenticates its own /api/sensors/batch POSTs with the same
          # token, so telemetry must keep flowing.
          sleep 10
          curl -fsS http://localhost/api/health | tee /tmp/wp-health2.json
          python3 -c "
          import json
          h = json.load(open('/tmp/wp-health2.json'))
          assert h['simulator']['reachable'], h['simulator']
          ages = {s: v['lastBatchAgeSec'] for s, v in h['stations'].items()}
          fresh = [s for s, a in ages.items() if a is not None and a < 60]
          assert fresh, f'no station received a recent batch: {ages}'
          print('simulator ingesting with the token set; batch ages:', ages)
          "
          # Match the simulator's own rejection message, not any "401" (log timestamps such
          # as "15:16:51,401" contain it).
          docker compose logs --tail=40 simulator | grep -E "rejected telemetry \(401\)|HTTP/1\.[01]\" 401 " \
            && { echo "::error::the simulator was rejected with 401"; exit 1; } || true

      # nginx answers 404 for the ingest route before the backend sees it, so even the
      # RIGHT token must not get through: a 401 here would mean the request reached the
      # backend. The simulator posts to backend:8080 directly and is unaffected — the
      # previous step already proved telemetry still flows.
      - name: Telemetry ingest is not reachable through nginx
        env:
          ADMIN_TOKEN: ci-operator-token
        run: |
          for path in /api/sensors/batch /api/sensors/batch/ /api/sensors/%62atch /api//sensors/batch; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is -X POST \
              -H 'Content-Type: application/json' -H "X-Admin-Token: ${ADMIN_TOKEN}" \
              -d '{"stationId":"maitri","timestamp":"2026-01-01T00:00:00Z","readings":{}}' \
              "http://localhost${path}")
            echo "POST ${path} (with token) -> ${code}"
            test "$code" = "404" || { echo "::error::POST ${path} returned ${code}, expected 404 from nginx"; exit 1; }
          done

      - name: Browser smoke test with write protection on
        env:
          E2E_BASE_URL: http://localhost
          ADMIN_TOKEN: ci-operator-token
        run: npm run test:e2e

      - name: Oversized request bodies are rejected by nginx
        run: |
          python3 -c "print('x' * 200000)" > /tmp/big.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data-binary @/tmp/big.json \
            http://localhost/api/aurora-explain)
          test "$code" = "413" || { echo "::error::a 200 kB body returned $code, expected 413"; exit 1; }
          echo "200 kB body -> 413"

      - name: Rate limits return 429 when hammered
        run: |
          # The explain zone is 5r/m with burst 2 nodelay, so the 4th rapid request must
          # be refused outright (in delay mode it would merely be queued and a sequential
          # caller would never see a 429 at all).
          got429=0
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"stationId":"maitri","question":"status"}' \
              http://localhost/api/aurora-explain)
            echo "explain #$i -> $code"
            [ "$code" = "429" ] && got429=1 && break
          done
          test "$got429" = "1" || { echo "::error::the explain route never returned 429"; exit 1; }
          # ...and the 429 carries the friendly JSON message, not nginx's HTML page.
          curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"stationId":"maitri","question":"status"}' \
            http://localhost/api/aurora-explain | tee /tmp/429.json
          grep -q 'please slow down' /tmp/429.json \
            || { echo "::error::429 body is not the friendly JSON message"; exit 1; }

          # The general /api zone is 30r/s with burst 60; a tight sequential loop runs far
          # faster than that, so it must trip within a few hundred requests.
          got429=0
          for i in $(seq 1 400); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost/api/station/maitri/state")
            if [ "$code" = "429" ]; then got429=1; echo "general zone 429 after $i requests"; break; fi
          done
          test "$got429" = "1" || { echo "::error::the general /api zone never returned 429"; exit 1; }

      - name: Normal dashboard use is not rate limited
        run: |
          # Let the buckets drain, then do what a page load does: a dozen reads.
          sleep 5
          for path in /api/health /api/stations /api/config/stations \
                      /api/station/maitri/state /api/alerts?stationId=maitri \
                      /api/risk?stationId=maitri /api/logistics?stationId=maitri \
                      /api/admin/config?stationId=maitri /api/ncpor/live?stationId=maitri \
                      /api/connection/status?stationId=maitri /api/remote/commands \
                      /api/alerts/history?stationId=maitri; do
            curl -fsS -o /dev/null "http://localhost${path}" \
              || { echo "::error::a normal page-load request was rejected: $path"; exit 1; }
          done
          echo "a page load's worth of reads: all 200"

      - name: Restore the no-token stack for the remaining steps
        run: |
          sed -i '/^ADMIN_TOKEN=/d' .env
          docker compose up -d --force-recreate backend simulator
          # Wait for the simulator as well, not just the backend: the next steps inject
          # through /api/sim/*, which is a proxy route and answers 503 until it is up.
          for i in $(seq 1 60); do
            if curl -fsS -m 3 http://localhost/api/health > /tmp/restore-health.json 2>/dev/null \
               && python3 -c "
          import json,sys
          h = json.load(open('/tmp/restore-health.json'))
          sys.exit(0 if h['db']['ok'] and h['simulator']['reachable'] else 1)
          " 2>/dev/null; then
              echo "stack back without a token after $((i * 3))s"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost/api/admin/session | tee /tmp/restore-session.json
          python3 -c "
          import json
          s = json.load(open('/tmp/restore-session.json'))
          assert s['writeProtected'] is False, f'protection is still on: {s}'
          print('write protection off again')
          "

      - name: The backend and simulator are NOT reachable from the host
        run: |
          fail=0
          for port in 8080 8001; do
            if curl -fsS -m 3 "http://localhost:${port}/" >/dev/null 2>&1; then
              echo "::error::port ${port} is reachable from the host but must be internal-only"
              fail=1
            else
              echo "port ${port}: not reachable from the host (correct)"
            fi
          done
          # ...while nginx can still reach the backend over the internal network.
          docker compose exec -T frontend wget -q -O- http://backend:8080/api/health >/dev/null
          echo "nginx -> backend over the aurora network: ok"
          exit $fail

      - name: Data survives a restart
        run: |
          alert_id() {
            curl -fsS "http://localhost/api/alerts?stationId=bharati" \
              | python3 -c "import json,sys; a=json.load(sys.stdin)['activeAlerts']; print(a[0]['id'] if a else '')"
          }
          id=$(alert_id)
          if [ -z "$id" ]; then
            echo "no open bharati alert; injecting one"
            curl -fsS -X POST "http://localhost/api/sim/inject/generator_failure?stationId=bharati" >/dev/null
            # The alert engine runs on the backend tick (2 s) and needs the injected
            # telemetry to arrive first, so poll rather than guessing a sleep.
            for i in $(seq 1 20); do
              id=$(alert_id)
              [ -n "$id" ] && { echo "alert raised after $((i * 2))s"; break; }
              sleep 2
            done
          fi
          if [ -z "$id" ]; then
            echo "::error::no bharati alert was raised after injecting generator_failure"
            curl -fsS "http://localhost/api/alerts?stationId=bharati" || true
            curl -fsS http://localhost/api/health || true
            docker compose logs --tail=60 backend simulator
            exit 1
          fi
          curl -fsS -X POST "http://localhost/api/alerts/$id/acknowledge" \
            -H 'Content-Type: application/json' -d '{"acknowledgedBy":"ci-restart-test"}' >/dev/null
          echo "acknowledged $id"

          docker compose restart
          for i in $(seq 1 60); do
            curl -fsS -m 3 http://localhost/api/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS "http://localhost/api/alerts/history?stationId=bharati&limit=200" \
            | python3 -c "
          import json,sys
          rows = json.load(sys.stdin)
          rows = rows.get('alerts', rows) if isinstance(rows, dict) else rows
          who = [r for r in rows if r.get('acknowledgedBy') == 'ci-restart-test']
          assert who, 'the acknowledgement did not survive the restart'
          print('acknowledgement persisted across restart:', who[0]['id'])
          "

      # ── Offline: the Python services get a network with no external route ──
      - name: Tear the online stack down
        run: docker compose down -v

      - name: Start with no access to the internet
        run: |
          docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
          for i in $(seq 1 60); do
            unhealthy=$(docker compose -f docker-compose.yml -f docker-compose.offline.yml ps \
              --format '{{.Service}} {{.Health}}' | awk '$2 != "healthy" { print $1 }')
            if [ -z "$unhealthy" ]; then echo "all healthy with no internet"; break; fi
            echo "waiting on: $unhealthy"
            sleep 5
          done
          test -z "$unhealthy" || {
            echo "::error::the offline stack never became healthy"
            docker compose -f docker-compose.yml -f docker-compose.offline.yml logs --tail=120
            exit 1
          }

      - name: Confirm the containers really have no internet
        run: |
          docker compose -f docker-compose.yml -f docker-compose.offline.yml exec -T backend python -c "
          import socket, sys
          socket.setdefaulttimeout(4)
          for host in ('api.open-meteo.com', 'archive-api.open-meteo.com', 'huggingface.co', 'api.groq.com'):
              try:
                  socket.create_connection((host, 443))
              except OSError as exc:
                  print(f'{host}: unreachable ({type(exc).__name__}) — correct')
              else:
                  sys.exit(f'::error::{host} is still reachable; the offline test proves nothing')
          "

      - name: Offline UI works and reports honest states
        env:
          E2E_BASE_URL: http://localhost
        run: |
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS http://localhost/api/health | tee /tmp/offline-health.json
          python3 -c "
          import json; h = json.load(open('/tmp/offline-health.json'))
          assert h['db']['ok'], h
          assert h['simulator']['reachable'], h
          # Chronos is honestly unavailable without the ML extras / HuggingFace.
          print('offline health:', h['status'], '| chronos:', h['chronos'])
          "
          # Telemetry still flows: the ERA5 replay caches are baked into the image.
          curl -fsS 'http://localhost/api/station/maitri/state' | python3 -c "
          import json,sys
          s = json.load(sys.stdin)
          assert s['dataSource'] in ('simulator', 'physics-fallback'), s['dataSource']
          assert s['sensors'], 'no sensors in the offline snapshot'
          print('offline telemetry:', s['dataSource'], '| provenance:', s['provenance'])
          "
          # The AI explain route must answer from the offline explainer, not fail.
          curl -fsS -X POST http://localhost/api/aurora-explain \
            -H 'Content-Type: application/json' \
            -d '{"stationId":"maitri","question":"status"}' | python3 -c "
          import json,sys
          r = json.load(sys.stdin)
          assert r.get('llmAvailable') is False, r
          assert r.get('explanation'), r
          print('offline explain:', r.get('mode'))
          "
          # And the whole UI still passes the browser smoke test.
          npm run test:e2e

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── WITH_ML=true: does Chronos actually come up? ────────────
  # Separate job: the torch + chronos install is slow and adds ~2.5 GB, so it must not
  # gate the image publish. Push-only, because it is far too slow for a PR check.
  ml-smoke:
    name: WITH_ML=true (Chronos available)
    runs-on: ubuntu-latest
    # Version tags and manual runs only: the torch install costs ~4 minutes of runner
    # time and the extras change far less often than the app does.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build the simulator with the Chronos extras
        env:
          WITH_ML: 'true'
          SIMULATOR_MEMORY_LIMIT: 3g
        run: docker compose build --progress plain simulator

      - name: Image size with ML
        continue-on-error: true
        run: |
          size=$(docker image inspect aurora-simulator:local --format '{{.Size}}')
          {
            echo '### Image size (amd64, WITH_ML=true)'
            echo
            echo '| Image | Size |'
            echo '|---|---|'
            printf '| aurora-simulator:local (ML) | %s |\n' "$(numfmt --to=iec --suffix=B "$size")"
          } >> "$GITHUB_STEP_SUMMARY"
          docker images aurora-simulator

      - name: Start the stack and confirm Chronos reports available
        env:
          WITH_ML: 'true'
          SIMULATOR_MEMORY_LIMIT: 3g
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "healthy" { print $1 }')
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          test -z "$unhealthy" || {
            echo "::error::the ML stack never became healthy"
            docker compose logs --tail=120
            exit 1
          }
          # The backend probes the simulator's /api/chronos-status with a 1 s timeout and
          # caches it for 5 s, so poll rather than asserting on the first read.
          for i in $(seq 1 20); do
            curl -fsS http://localhost/api/health -o /tmp/ml-health.json || true
            if python3 -c "
          import json,sys
          h = json.load(open('/tmp/ml-health.json'))
          sys.exit(0 if h.get('chronos', {}).get('available') is True else 1)
          " 2>/dev/null; then
              echo "chronos available"
              python3 -c "import json; print('chronos:', json.load(open('/tmp/ml-health.json'))['chronos'])"
              break
            fi
            sleep 6
          done
          python3 -c "
          import json; h = json.load(open('/tmp/ml-health.json'))
          c = h['chronos']
          assert c['available'] is True, f'Chronos not available with WITH_ML=true: {c}'
          "
          # The simulator must not be OOM-killed under the 3g limit.
          test "$(docker inspect --format '{{.State.OOMKilled}}' "$(docker compose ps -q simulator)")" = "false"

      - if: failure()
        run: docker compose logs --tail=200

      - if: always()
        run: docker compose down -v

  # ── Multi-arch images -> GHCR ───────────────────────────────
  build:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: compose-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: docker/frontend.Dockerfile
          - name: backend
            dockerfile: docker/backend.Dockerfile
          - name: simulator
            dockerfile: docker/simulator.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: platforms
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            echo "list=${{ env.PLATFORMS_RELEASE }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${{ env.PLATFORMS_DEFAULT }}" >> "$GITHUB_OUTPUT"
          fi

      # arm64 is built under emulation on the amd64 runner, so QEMU is only needed
      # for the release platform set.
      - uses: docker/setup-qemu-action@v3
        if: contains(steps.platforms.outputs.list, 'arm64')
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Pull requests build both architectures but push nothing, so a fork cannot
      # publish an image.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── Prove the arm64 images really run ───────────────────────
  verify-arm64:
    name: Run the arm64 images under QEMU
    runs-on: ubuntu-latest
    needs: build
    # Only version tags and manual runs publish arm64 images, so there is nothing to
    # verify otherwise.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The arm64 backend starts and answers /api/health
        run: |
          tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)
          image="${{ env.IMAGE_PREFIX }}-backend:${tag}"
          docker run -d --name aurora-arm64 --platform linux/arm64 \
            -e ALLOWED_ORIGINS=http://localhost -p 18080:8080 "$image"
          for i in $(seq 1 60); do
            if curl -fsS -m 5 http://localhost:18080/api/health >/dev/null 2>&1; then
              echo "arm64 backend healthy under QEMU"
              curl -fsS http://localhost:18080/api/health | head -c 400; echo
              docker exec aurora-arm64 python -c "import platform; print('arch:', platform.machine())"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the arm64 backend never answered"
          docker logs aurora-arm64 --tail=100
          exit 1

      - if: always()
        run: docker rm -f aurora-arm64 || true
