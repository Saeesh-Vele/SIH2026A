# Aurora (SIH PS 26060) — tooling config.
# The project is not packaged; this file only configures pytest, coverage and ruff.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["simulator/tests"]
# conftest.py puts simulator/ on sys.path, so tests import `physics_model`, `db`, … directly.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not ml and not slow",
]
markers = [
    "ml: needs torch + chronos-forecasting (simulator/requirements-ml.txt). Run with `pytest -m ml`.",
    "slow: heavy physics walk-forward over the committed ERA5 caches. Run with `pytest -m slow`.",
]
filterwarnings = [
    # Warnings raised by Aurora's own code are bugs — fail on them.
    "error:::simulator.*",
    "error:::conftest",
    "error:::test_.*",
    # Everything else (dependency deprecations we don't control) stays a warning.
    "default",
]

# ── Type checking (IDE only; nothing here runs in CI or at run time) ──────────
# simulator/ modules import each other flat (`import db`, `from units import …`) because
# simulator/config.py resolves paths module-relative and each service adds its own
# directory to sys.path at startup. A type checker has no way to infer that, so without
# `search-path` it reports every local import as missing — 86 of them — and it guesses the
# import root is src/ (the Vite app) from the project layout.
#
# `python-interpreter` pins the project venv. Otherwise Pyrefly queries whichever
# interpreter it finds first, which on a machine with Anaconda on PATH is
# /opt/anaconda3 — a different site-packages that has none of Aurora's dependencies.
[tool.pyrefly]
project-includes = ["simulator"]
project-excludes = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "legacy",
    "dist",
]
# simulator/tests is a second root: pytest puts the test directory on sys.path, which is
# how `from conftest import insert_obs` resolves at run time.
search-path = ["simulator", "simulator/tests"]
# The version comes from this interpreter; do not also pin python-version or the two can
# disagree (the venv is 3.13 locally, CI runs 3.12).
python-interpreter = ".venv/bin/python"

[tool.coverage.run]
source = ["simulator"]
branch = true
omit = [
    "simulator/tests/*",
    "simulator/migrations/*",
    # Offline CLI scripts: training/evaluation tools, not part of the running services.
    "simulator/evaluate_anomaly.py",
    "simulator/forecast_arena.py",
    "simulator/validate_baseline.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private buffers on purpose and import fixtures by name.
"simulator/tests/*" = ["B018"]

[tool.ruff.lint.isort]
# simulator/ modules are imported flat (conftest.py adds it to sys.path), so ruff must
# not mistake them for third-party packages.
known-first-party = [
    "alert_engine", "analytics_ai_engine", "anomaly_engine", "assistant", "cascade", "chronos_forecaster",
    "config", "db", "decision_engine", "decision_scheduler", "forecast_engine", "ncpor_ingestor",
    "offline_explain", "physics_model", "simulator", "station_config", "station_store",
    "twin_inspector", "unified_backend", "units", "validation", "weather_data",
]
